[advisories]
# All suppressions below are transitive dependencies of cozo 0.7.6,
# the latest stable release. There is no cozo upgrade available on
# crates.io that resolves these; suppressed until cozo publishes a fix.
ignore = [
    # fxhash 0.2.1 unmaintained — via jieba-rs / graph_builder → cozo
    "RUSTSEC-2025-0057",

    # adler 1.0.2 unmaintained — via miniz_oxide → swapvec → cozo
    "RUSTSEC-2025-0056",

    # bincode 1.3.3 unmaintained — via swapvec / fast2s → cozo
    "RUSTSEC-2025-0141",

    # lz4_flex 0.10.0 memory disclosure (high) — via swapvec → cozo
    # Fix requires lz4_flex >=0.11.6; cozo 0.7.6 pins 0.10.0
    "RUSTSEC-2026-0041",

    # rand 0.8.5 unsound with custom logger — via cozo
    "RUSTSEC-2026-0097",

    # crossbeam-epoch 0.9.18 invalid pointer deref in fmt::Pointer impl —
    # via crossbeam → cozo. No cozo release pins a newer crossbeam.
    "RUSTSEC-2026-0204",

    # rustls-webpki 0.101.7 — via minreq → cozo. cozo 0.7.6 pins minreq
    # 2.14.1, which has no release upgrading rustls-webpki.
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",

    # thin-vec 0.2.14 use-after-free/double-free in IntoIter::drop — via
    # ra_ap_* (rust-analyzer) crates pulled in by the optional `ra`
    # feature. No ra_ap_* release upgrades thin-vec.
    "RUSTSEC-2026-0103",
]
